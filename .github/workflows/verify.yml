name: Verify research
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            verification/**/*.json
            verification/**/*.log
  manuscripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - run: make pdf
      - uses: actions/upload-artifact@v4
        with:
          name: research-pdfs
          path: build/*.pdf
